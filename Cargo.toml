[package]
name = "live-gallery"
version = "0.1.0"
edition = "2024"
description = "Watch folders and see new images and 3D models live"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha1_smol = "1"
percent-encoding = "2"
mime_guess = "2"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11"

[dev-dependencies]
tempfile = "3"
